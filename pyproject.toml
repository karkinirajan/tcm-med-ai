[project]
name = "fastkwan"
version = "1.0.0"
description = "FastKwan: a FastAPI service for Traditional Chinese Medicine syndrome differentiation, lifestyle advice and prescription suggestions, using OpenAI, Pinecone, Cohere and MongoDB."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "openai>=1.50",
    "cohere>=5.11",
    "pinecone>=5",
    "langchain-openai>=0.3",
    "langchain-pinecone>=0.2",
    "pymongo>=4.10",
]

[project.scripts]
fastkwan = "fastkwan.main:run"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "httpx>=0.27", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastkwan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fastkwan --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
